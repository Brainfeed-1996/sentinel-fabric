<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Fabric | Security Operations Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #030712;
      --bg-secondary: #0a0f1a;
      --bg-tertiary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-card-hover: rgba(17, 24, 39, 0.9);
      --border-primary: #1f2937;
      --border-accent: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-primary: #10b981;
      --accent-secondary: #06b6d4;
      --accent-tertiary: #8b5cf6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --critical: #dc2626;
      --high: #f97316;
      --medium: #eab308;
      --low: #22c55e;
      --font-display: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 40px rgba(16, 185, 129, 0.15);
      --gradient-primary: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
      --gradient-danger: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border-primary); padding: 24px 16px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin-bottom: 32px; }
    .logo-icon { width: 40px; height: 40px; background: var(--gradient-primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: var(--shadow-glow); }
    .logo-text { font-size: 18px; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-section { margin-bottom: 24px; }
    .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0 12px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--accent-primary); }
    .nav-item i { width: 20px; text-align: center; font-size: 16px; }
    .nav-badge { margin-left: auto; background: var(--danger); color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .sidebar-footer { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border-primary); }
    .user-profile { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--bg-tertiary); }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient-accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-role { font-size: 12px; color: var(--text-muted); }
    .main-content { flex: 1; margin-left: 260px; background: var(--bg-primary); }
    .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .page-title { font-size: 24px; font-weight: 700; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-secondary); text-decoration: none; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .search-box { position: relative; }
    .search-box input { background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); padding: 10px 16px 10px 40px; font-size: 14px; color: var(--text-primary); width: 280px; }
    .search-box input:focus { outline: none; border-color: var(--accent-primary); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; border: none; }
    .btn-primary { background: var(--gradient-primary); color: white; box-shadow: var(--shadow-md); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-primary); }
    .btn-icon { width: 40px; height: 40px; padding: 0; justify-content: center; background: var(--bg-tertiary); border: 1px solid var(--border-primary); color: var(--text-secondary); }
    .btn-icon:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .content { padding: 32px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); padding: 24px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-primary); opacity: 0; transition: opacity 0.3s ease; }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--border-accent); box-shadow: var(--shadow-lg); }
    .stat-card:hover::before { opacity: 1; }
    .stat-card.danger::before { background: var(--gradient-danger); }
    .stat-card.warning::before { background: var(--warning); }
    .stat-card.info::before { background: var(--info); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .stat-icon.primary { background: rgba(16, 185, 129, 0.15); color: var(--accent-primary); }
    .stat-icon.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .stat-icon.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .stat-icon.info { background: rgba(59, 130, 246, 0.15); color: var(--info); }
    .stat-trend { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
    .stat-trend.up { color: var(--success); }
    .stat-trend.down { color: var(--danger); }
    .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 4px; font-family: var(--font-mono); }
    .stat-label { font-size: 14px; color: var(--text-secondary); }
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px; }
    .chart-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); padding: 24px; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .chart-title { font-size: 16px; font-weight: 600; }
    .chart-actions { display: flex; gap: 8px; }
    .chart-period { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-primary); cursor: pointer; }
    .chart-period.active { background: rgba(16, 185, 129, 0.1); color: var(--accent-primary); border-color: var(--accent-primary); }
    .chart-container { height: 240px; position: relative; }
    .bar-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 100%; padding: 20px 0; }
    .bar-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .bar { width: 40px; background: var(--gradient-primary); border-radius: 6px 6px 0 0; transition: all 0.3s ease; }
    .bar-label { font-size: 12px; color: var(--text-muted); }
    .bar-value { font-size: 14px; font-weight: 600; font-family: var(--font-mono); }
    .donut-container { display: flex; align-items: center; justify-content: center; height: 100%; }
    .donut-chart { width: 180px; height: 180px; position: relative; }
    .donut-chart svg { transform: rotate(-90deg); }
    .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .donut-total { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
    .donut-label { font-size: 12px; color: var(--text-muted); }
    .donut-legend { display: flex; flex-direction: column; gap: 12px; margin-left: 32px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    .legend-text { font-size: 13px; color: var(--text-secondary); }
    .legend-value { font-size: 14px; font-weight: 600; font-family: var(--font-mono); margin-left: auto; }
    .table-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); overflow: hidden; }
    .table-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border-primary); }
    .table-title { font-size: 16px; font-weight: 600; }
    .table-search { display: flex; align-items: center; gap: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); padding: 8px 16px; }
    .table-search input { background: transparent; border: none; font-size: 14px; color: var(--text-primary); width: 200px; }
    .table-search input:focus { outline: none; }
    .table-search i { color: var(--text-muted); }
    .table-filters { display: flex; gap: 8px; }
    .filter-btn { padding: 8px 16px; border-radius: var(--radius-md); font-size: 13px; background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-primary); cursor: pointer; }
    .filter-btn:hover { background: var(--bg-card-hover); }
    .filter-btn.active { background: rgba(16, 185, 129, 0.1); color: var(--accent-primary); border-color: var(--accent-primary); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 14px 24px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-tertiary); border-bottom: 1px solid var(--border-primary); }
    td { padding: 16px 24px; font-size: 14px; border-bottom: 1px solid var(--border-primary); }
    tr:hover { background: var(--bg-tertiary); }
    .severity-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .severity-badge.critical { background: rgba(220, 38, 38, 0.15); color: var(--critical); }
    .severity-badge.high { background: rgba(249, 115, 22, 0.15); color: var(--high); }
    .severity-badge.medium { background: rgba(234, 179, 8, 0.15); color: var(--medium); }
    .severity-badge.low { background: rgba(34, 197, 94, 0.15); color: var(--low); }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .status-badge.open { background: rgba(59, 130, 246, 0.15); color: var(--info); }
    .status-badge.triage { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-badge.resolved { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-badge.running { background: rgba(139, 92, 246, 0.15); color: var(--accent-tertiary); }
    .asset-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--accent-secondary); }
    .action-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-muted); cursor: pointer; }
    .action-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .pagination { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-top: 1px solid var(--border-primary); }
    .pagination-info { font-size: 14px; color: var(--text-muted); }
    .pagination-controls { display: flex; gap: 8px; }
    .page-btn { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-primary); color: var(--text-secondary); font-size: 14px; cursor: pointer; }
    .page-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .page-btn.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .activity-feed { display: flex; flex-direction: column; gap: 16px; }
    .activity-item { display: flex; gap: 16px; padding: 12px; border-radius: var(--radius-md); }
    .activity-item:hover { background: var(--bg-tertiary); }
    .activity-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .activity-icon.scan { background: rgba(16, 185, 129, 0.15); color: var(--accent-primary); }
    .activity-icon.alert { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .activity-icon.resolve { background: rgba(59, 130, 246, 0.15); color: var(--info); }
    .activity-content { flex: 1; }
    .activity-text { font-size: 14px; color: var(--text-primary); }
    .activity-text strong { font-weight: 600; }
    .activity-time { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .action-card { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); cursor: pointer; }
    .action-card:hover { background: var(--bg-card-hover); border-color: var(--border-accent); }
    .action-card-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .action-card-icon.scan { background: rgba(16, 185, 129, 0.15); color: var(--accent-primary); }
    .action-card-icon.policy { background: rgba(139, 92, 246, 0.15); color: var(--accent-tertiary); }
    .action-card-icon.export { background: rgba(6, 182, 212, 0.15); color: var(--accent-secondary); }
    .action-card-icon.report { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .action-card-text h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .action-card-text p { font-size: 12px; color: var(--text-muted); }
    .status-bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-primary); font-size: 12px; color: var(--text-muted); }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.offline { background: var(--danger); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.5s ease forwards; }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
    .toast { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast-icon { font-size: 18px; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast-content { flex: 1; }
    .toast-title { font-size: 14px; font-weight: 600; }
    .toast-message { font-size: 12px; color: var(--text-muted); }
    .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    @media (max-width: 1400px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
        <span class="logo-text">Sentinel Fabric</span>
      </div>
      <nav class="nav-section">
        <div class="nav-label">Overview</div>
        <a class="nav-item active" data-nav="dashboard"><i class="fas fa-chart-line"></i>Dashboard</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-label">Assets</div>
        <a class="nav-item" data-nav="assets"><i class="fas fa-layer-group"></i>Assets<span class="nav-badge">2</span></a>
        <a class="nav-item" data-nav="inventory"><i class="fas fa-boxes-stacked"></i>Inventory</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-label">Findings</div>
        <a class="nav-item" data-nav="findings"><i class="fas fa-bug"></i>Findings<span class="nav-badge">2</span></a>
      </nav>
      <nav class="nav-section">
        <div class="nav-label">Intelligence</div>
        <a class="nav-item" data-nav="attack-surface"><i class="fas fa-radar"></i>Attack Surface</a>
        <a class="nav-item" data-nav="graphs"><i class="fas fa-project-diagram"></i>Graph Explorer</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-label">Operations</div>
        <a class="nav-item" data-nav="scans"><i class="fas fa-search"></i>Scans</a>
        <a class="nav-item" data-nav="policies"><i class="fas fa-gavel"></i>Policies</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-label">System</div>
        <a class="nav-item" data-nav="logs"><i class="fas fa-file-alt"></i>Audit Logs</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">SA</div>
          <div class="user-info">
            <div class="user-name">Security Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main-content" id="mainContent"></main>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="./app.js"></script>
</body>
</html>
