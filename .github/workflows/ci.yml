name: ci

on:
  push:
  pull_request:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start API
        run: node apps/api/src/server.js &
      - name: Wait for API
        run: sleep 2
      - name: Smoke test overview endpoint
        run: curl --fail http://127.0.0.1:8080/api/v1/overview
